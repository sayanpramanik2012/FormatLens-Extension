<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FormatLens</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icons/icon48.png" alt=""><div><h1>FormatLens</h1><p id="status" aria-live="polite">Ready to inspect this page</p></div></div>
    <button id="theme" class="icon-button" title="Theme: system" aria-label="Cycle color theme">◐</button>
  </header>
  <section class="actions"><button id="extract" class="primary">Extract page text</button><button id="pick">Pick element</button></section>
  <section class="meta"><span id="detected">Plain text</span><label><input id="wrap" type="checkbox" checked> Wrap</label><button id="copy">Copy</button></section>
  <label class="search"><span>Search</span><input id="search" placeholder="Find text, values, or JSON paths" autocomplete="off"></label>
  <nav role="tablist" aria-label="Content views"><button class="tab active" data-tab="pretty" role="tab">Pretty</button><button class="tab" data-tab="tree" role="tab">Tree</button><button class="tab" data-tab="raw" role="tab">Raw</button></nav>
  <main><pre id="pretty" class="pane wrap" tabindex="0"></pre><div id="tree" class="pane hidden" tabindex="0"></div><pre id="raw" class="pane wrap hidden" tabindex="0"></pre></main>
  <footer>Private by design · All formatting happens locally</footer>
  <script src="sidepanel.js"></script>
</body>
</html>
