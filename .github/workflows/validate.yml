name: Validate extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifest and JavaScript syntax
        run: |
          node -e "const m=require('./extension/manifest.json'); if(m.name!=='FormatLens'||m.version!=='1.0.0') process.exit(1)"
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/sidepanel.js
      - name: Verify required extension icons
        run: test -f extension/icons/icon-16.png && test -f extension/icons/icon-32.png && test -f extension/icons/icon-48.png && test -f extension/icons/icon-128.png
